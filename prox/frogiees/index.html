    <script> // Open URL'S In About:Blank
    function openGame(url) {
        var win = window.open();
        win.document.title = "Blooket"; // Set title for the new window
        win.document.head.innerHTML += '<link rel="icon" type="image/x-icon" href="./assets/img/favicon.ico">'; // Set favicon for the new window
        win.document.body.style.margin = '0'; // Remove Border
        win.document.body.style.height = '100vh'; // Remove Border
        var iframe = win.document.createElement('iframe');
        iframe.style.width = "100%";
        iframe.style.height = "100%";
        iframe.style.border = "none";
        iframe.src = url;
        win.document.body.appendChild(iframe);
    }
</script>
